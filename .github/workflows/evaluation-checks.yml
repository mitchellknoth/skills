name: Evaluation package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check generated core and offline tests
        run: |
          python3 scripts/sync-fleet-core.py --check
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s evals/adapters -p 'test_*.py' -v
          python3 -m unittest evals.harbor.test_bridge -v
      # No inference, provider credentials, PR write access, or live release claim.
