<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">How the fleet works</title><desc id="desc">Outcome ownership, risk-selected capabilities, review, authorization, and observation are connected by durable task state. Feedback updates future work without granting new authority.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172554}.title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#475569}.head{font-size:21px;font-weight:700}.body{font-size:17px}.label{font-size:15px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1200" height="760" fill="#f8fafc"/><text x="48" y="55" class="title">How the fleet works</text>
<text x="48" y="86" class="subtitle">A shared contract, with roles and cadence chosen by each installation.</text>
<rect x="48" y="120" width="330" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text x="68" y="154" class="head">1  Frame and coordinate</text>
<text x="68" y="185" class="body">Goal, acceptance and constraints</text>
<text x="68" y="211" class="body">One owner of the whole outcome</text>
<text x="68" y="237" class="body">Plan the next useful increment</text>
<rect x="435" y="120" width="330" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text x="455" y="154" class="head">2  Do the work</text>
<text x="455" y="185" class="body">Select capabilities by task and risk</text>
<text x="455" y="211" class="body">Main loop or bounded delegation</text>
<text x="455" y="237" class="body">Preserve partial results</text>
<rect x="822" y="120" width="330" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text x="842" y="154" class="head">3  Verify and reconcile</text>
<text x="842" y="185" class="body">Inspect artifacts and evidence</text>
<text x="842" y="211" class="body">Independent review when required</text>
<text x="842" y="237" class="body">Resolve or disposition findings</text>
<path d="M378 190 H435" class="line"/>
<path d="M765 190 H822" class="line"/>
<rect x="822" y="330" width="330" height="145" rx="14" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="842" y="364" class="head">4  Act within authority</text>
<text x="842" y="395" class="body">Readiness and permission differ</text>
<text x="842" y="421" class="body">Check both for this target/revision</text>
<text x="842" y="447" class="body">Do not infer approval from a peer</text>
<rect x="435" y="330" width="330" height="145" rx="14" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="455" y="364" class="head">5  Observe the result</text>
<text x="455" y="395" class="body">Confirm the external outcome</text>
<text x="455" y="421" class="body">Separate merge, deploy, acceptance</text>
<text x="455" y="447" class="body">Unknown is not success</text>
<rect x="48" y="330" width="330" height="145" rx="14" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="68" y="364" class="head">6  Learn and improve</text>
<text x="68" y="395" class="body">Evidence-backed lessons</text>
<text x="68" y="421" class="body">Bounded proposals and trials</text>
<text x="68" y="447" class="body">Keep, revise or revert by outcome</text>
<path d="M987 260 V330" class="line"/>
<path d="M822 402 H765" class="line"/>
<path d="M435 402 H378" class="line"/>
<path d="M213 330 V260" class="line"/>
<text x="48" y="518" class="head">Shared support, not a substitute for evidence or authorization</text>
<rect x="48" y="540" width="330" height="132" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text x="68" y="574" class="head">Durable task state</text>
<text x="68" y="605" class="body">Intent · revision · owner · blocker</text>
<text x="68" y="631" class="body">Next checkpoint · evidence links</text>
<rect x="435" y="540" width="330" height="132" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text x="455" y="574" class="head">Persona, skills and memory</text>
<text x="455" y="605" class="body">Role-specific working judgment</text>
<text x="455" y="631" class="body">Scoped lessons with provenance</text>
<rect x="822" y="540" width="330" height="132" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text x="842" y="574" class="head">Routines and adapters</text>
<text x="842" y="605" class="body">Triggers, tools and state locations</text>
<text x="842" y="631" class="body">Only capabilities actually available</text>
<text x="48" y="720" class="subtitle">Design contract, not proof that every runtime binding or learning loop is operating.</text>
</svg>
