[tools]
python = "3.12.14"

[tasks."eval:check"]
description = "Offline package and evaluation tests; no model calls"
run = ["python scripts/sync-fleet-core.py --check", "python -m unittest discover -s tests -v", "python -m unittest evals.harbor.test_bridge -v", "python -m unittest discover -s evals/adapters -p 'test_*.py' -v"]

[tasks."eval:plan"]
description = "Show paired trial plan and call budget without inference"
run = "python evals/run.py plan"

[tasks."eval:smoke"]
description = "Offline mock plumbing check; not evidence of skill effectiveness"
run = "python evals/run.py mock"

[tasks."eval:run"]
description = "Explicit live run with local config: mise run eval:run -- --allow-inference"
run = "python evals/run.py run --config evals/local.json"

[tasks."eval:harbor:export"]
description = "Generate frozen paired Harbor tasks; no model calls"
run = "python -m evals.harbor.export --config evals/local.example.json --out .eval-results/harbor-smoke"
