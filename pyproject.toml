[project]
name = "skills-evaluation-pilot"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = ["jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "evals/adapters", "evals/harbor"]
pythonpath = [".", "evals/adapters"]
addopts = "-ra"
